version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - cat-routine-update
      - cat-ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - cat-routine-update
      - area:packaging

  - package-ecosystem: pip
    directory: /tools/cudnn_repro
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - cat-routine-update
      - area:packaging

  - package-ecosystem: pip
    directory: /samples/models
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - cat-routine-update
      - area:packaging
    # The exact pins of samples/models/constraints-native.txt: the versions the stack `native` of a model sample was
    # last run and checked with. A pin changes only together with a run of the stack on the new version, never with an
    # update of the pin alone. The library's kernel-binary package (flashinfer-cubin) is one of them, at the library's
    # own version.
    ignore:
      - dependency-name: torch
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: nvidia-cutlass-dsl
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: flashinfer-python
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: apache-tvm-ffi
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: flashinfer-cubin
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
