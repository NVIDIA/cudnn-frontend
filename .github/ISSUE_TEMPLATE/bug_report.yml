name: Bug report
description: Report incorrect behavior, a regression, crash, or performance problem.
title: "[Bug]: "
labels:
  - cat-bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. A minimal reproducer and complete environment make investigation much faster.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
        - label: I reduced the problem to the smallest reproducer I can provide.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - C++ frontend API or graph construction
        - Python API or bindings
        - FE OSS kernels or CuTeDSL
        - Build, packaging, or installation
        - CI or test infrastructure
        - Documentation or samples
        - Benchmarks or performance
        - Not sure
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal runnable program or exact commands, inputs, and configuration.
      placeholder: |
        1. Install or build ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error or incorrect result.

  - type: input
    id: frontend-version
    attributes:
      label: cuDNN Frontend version or commit
      placeholder: v1.26.0 or abc1234

  - type: input
    id: backend-version
    attributes:
      label: cuDNN Backend version
      placeholder: 9.24.0

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant GPU architecture, CUDA runtime and driver, OS, compiler, Python, and framework versions. Enter N/A where not applicable.
      placeholder: |
        GPU: B200 (SM100)
        CUDA runtime: 13.1
        CUDA driver: 590.XX
        OS: Ubuntu 24.04
        Compiler: GCC 13.3
        Python: 3.12
        Framework: PyTorch 2.X
  - type: input
    id: last-known-good
    attributes:
      label: Last known working version
      description: For regressions, provide the last release or commit where this worked.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste the smallest relevant excerpt and attach full logs if needed. Redact secrets.
        Frontend: CUDNN_FRONTEND_LOG_FILE=fe.log CUDNN_FRONTEND_LOG_INFO=1
        Backend: CUDNN_LOGLEVEL_DBG=3 CUDNN_LOGDEST_DBG=be.log
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, profiler output, workarounds, suspected commits, or related issues.
