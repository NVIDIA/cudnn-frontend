name: PR merge requirements

# Blocks merging until the PR has a Milestone. Runs as `pull_request_target`
# so that PRs from forks get the repo secrets; this is safe because the job
# never checks out or executes PR code — it only queries PR metadata.
on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
      - labeled
      - unlabeled
      - milestoned
      - demilestoned

permissions:
  pull-requests: read

jobs:
  merge-requirements:
    # Draft PRs are skipped; marking one ready for review runs the check.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check milestone assignment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -u

          # Bot PRs (dependabot, github-actions, ...) are exempt.
          if [ "${AUTHOR_TYPE}" = "Bot" ]; then
            echo "PR author is a bot — merge requirements do not apply."
            exit 0
          fi

          # Query live PR state rather than the (possibly stale) event
          # payload, so that re-running this check after fixing the fields
          # passes without needing a new PR event.
          pr_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")

          if echo "${pr_json}" | jq -e 'any(.labels[]; .name == "cat-routine-update")' > /dev/null; then
            echo "PR is labeled cat-routine-update — merge requirements do not apply."
            exit 0
          fi

          failed=0

          milestone=$(echo "${pr_json}" | jq -r '.milestone.title // empty')
          if [ -n "${milestone}" ]; then
            echo "Milestone: ${milestone}"
          else
            echo "::error::This PR has no Milestone."
            failed=1
          fi

          if [ "${failed}" -ne 0 ]; then
            echo ""
            echo "Set the Milestone field in the PR sidebar."
            exit 1
          fi
          echo "All merge requirements satisfied."
