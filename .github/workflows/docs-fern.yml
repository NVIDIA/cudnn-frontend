name: Docs check

# Validates the Fern project under docs/fern and runs the repository checks for
# navigation coverage, generated content, components, and canonical samples.
#
# `fern check` needs no credentials. Publishing (`fern generate`) does, and
# is deliberately not wired up here — it needs FERN_TOKEN from #cdd-fern.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - "docs/**"
      - "tools/doc/**"
      - ".github/workflows/docs-fern.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "docs/**"
      - "tools/doc/**"

permissions:
  contents: read

jobs:
  fern-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # Manifest generation reads declarations from the commit pinned in
      # docs/compatibility.json, so the checkout must include repository history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fern CLI
        run: npm install -g fern-api@5.56.3

      - name: Install documentation test dependencies
        run: python -m pip install pytest PyYAML

      - name: Check generated documentation
        run: |
          python tools/doc/build_doc_manifests.py --check
          python tools/doc/build_doc_indexes.py --check
          python tools/doc/check_doc_coverage.py --mode release
          python tools/doc/run_doc_samples.py --list > /dev/null
          python -m pytest tools/doc/tests -q

      # MDX renders <img> as JSX, where an unclosed tag is a parse error.
      - name: Lint for unclosed <img> tags
        run: |
          BAD=$(grep -rn '<img\b[^>]*[^/]>\|<img>' docs/ --include="*.md" --include="*.mdx" || true)
          if [ -n "$BAD" ]; then
            echo "Unclosed <img> tags (use <img ... />):"
            echo "$BAD"
            exit 1
          fi

      - name: fern check
        working-directory: docs/fern
        run: fern check --warnings
