[pytest]
markers =
    allow_host_sync: DSA plan tests explicitly exercising a declared host-sync debug path
    L0: specifies L0 level (use -m L0)
    L1: specifies L1 level (use -m L1)
    no_workspace_shim: gemm/frost -- do not let the harness supply a workspace to direct MoE plan calls
    L2: specifies L2 level (use -m L2)
    L3: specifies L3 level (use -m L3)
    L4: specifies L4 level (use -m L4)
    gpu_exclusive: tests that require exclusive GPU access (no concurrent kernels from other processes)
    moe_ep_multinode: torchrun-native multi-node MoE EP tests
    known_e5m2_edge_on_rubin: sdpa/frost -- per-tensor FP8 ids whose max|O-ref| reads 0.0404-0.0409 on the 204-SM Rubin dataset; _check xfails ONLY that comparison inside the window
    smoke: test tier -- one cell per code path (engine row x dtype x mask arm x layout), applied by conftest.py from tiers/smoke_<arch>.txt; select with -m smoke
    nightly_only: test tier -- L0 cells that leave the FULL local run (codegen pins with a numerics twin, B/H/seed twins), applied from tiers/nightly_only.txt; FULL = -m "L0 and not nightly_only"
addopts = 
    -m L0 --tb=short --no-header
